<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3cf73">
<title>What is this? — Picture Quest</title>
<style>
:root{
  --cream:#fff8e7;--paper:#fffdf5;--green:#178777;--green-dark:#24433e;
  --yellow:#f3cf73;--yellow-soft:#fff0b8;--red:#b95555;--ink:#24433e;
  --line:#e7d8b9;--shadow:0 4px 0 var(--green-dark);
}
*{box-sizing:border-box}
body{margin:0;background:#f4eee7;font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center}
button{font:inherit}
.game{width:min(460px,100%);min-height:100vh;background:var(--cream);padding:44px 24px 38px;position:relative;overflow:hidden}
.game:before,.game:after{content:"";position:absolute;left:0;right:0;height:28px;background:var(--yellow);z-index:0}
.game:before{top:0;border-radius:0 0 50% 50%/0 0 100% 100%}
.game:after{bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
.screen{display:none;position:relative;z-index:1}.screen.active{display:block}
h1{text-align:center;color:#238b7b;font-size:45px;line-height:.95;margin:15px 0 18px;font-weight:900;letter-spacing:-1px}
.subtitle{text-align:center;margin:-8px 0 20px;color:#6e8078;font-size:14px;font-weight:700}
.stats-strip{display:flex;gap:8px;margin:0 0 19px}
.stat{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 5px;text-align:center}
.stat strong{display:block;font-size:20px;color:var(--green)}.stat span{font-size:10px;font-weight:800;color:#7e8f87;text-transform:uppercase}
.mode-box{background:var(--yellow-soft);border:2px solid #e0bd58;border-radius:13px;padding:11px;margin-bottom:18px}
.mode-title{font-size:11px;font-weight:900;text-transform:uppercase;text-align:center;margin-bottom:8px;color:#836b2e}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-switch button,.daily-btn,.category,.btn,.answer,.hint-btn{cursor:pointer}
.mode-switch button{border:2px solid #bca463;border-radius:8px;background:#fff8df;color:var(--ink);font-size:12px;font-weight:900;padding:8px}
.mode-switch button.selected{background:var(--green);border-color:var(--green-dark);color:#fff}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.category{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 9px 10px;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.category:active,.btn:active,.answer:active,.daily-btn:active{transform:translateY(2px);box-shadow:none}
.category .icon{font-size:48px;height:57px;display:grid;place-items:center}
.category-name{font-size:13px;font-weight:900;color:#fff;background:var(--green);border-radius:6px;padding:8px 3px}
.category-meta{font-size:10px;font-weight:800;color:#7e8f87;margin-top:7px}
.daily-btn{width:100%;border:2px solid #9e7a20;border-radius:11px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:14px;padding:11px;margin:16px 0 0;box-shadow:0 3px 0 #8b6b23}
.daily-btn small{display:block;font-size:10px;margin-top:3px;color:#6f5920}
.quiz-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.back-btn{border:0;background:none;color:var(--green);font-size:22px;font-weight:900;cursor:pointer;padding:0 5px}
.quiz-title{flex:1;font-weight:900;font-size:14px}.quiz-title small{display:block;font-size:10px;color:#7e8f87;margin-top:2px}
.quiz-score{font-weight:900;color:var(--green);font-size:13px;text-align:right}
.progress-track,.timer-track{height:8px;background:#eadfca;border-radius:99px;overflow:hidden;margin-bottom:9px}
.progress-fill,.timer-fill{height:100%;width:0;background:var(--green);border-radius:inherit;transition:width .25s ease}
.timer-track{height:6px;margin-bottom:13px}.timer-fill{background:#e0a426}
.timer-fill.danger{background:var(--red)}
.photo{height:270px;border:7px solid #9a6841;background:#ead9b9;display:grid;place-items:center;overflow:hidden;margin-bottom:16px;border-radius:8px;box-shadow:0 3px 0 #6f4a30}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
.fallback{font-size:100px}.answers{display:grid;gap:10px}
.answer{width:100%;min-height:47px;background:var(--green);color:#fff;border:2px solid var(--green-dark);border-radius:8px;font-weight:900;font-size:16px;box-shadow:0 3px 0 var(--green-dark);padding:9px}
.answer.correct{background:#3d9668}.answer.wrong{background:var(--red)}.answer:disabled{opacity:1}
.quiz-tools{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.feedback{min-height:25px;font-size:15px;font-weight:900}.hint-btn{border:2px solid #bca463;background:var(--yellow-soft);color:#765c17;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:900}
.hint-btn:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center;padding-top:24px}.result h1{margin-bottom:5px}
.result-badge{font-size:52px;margin:4px 0}.result-label{font-size:13px;font-weight:800;color:#75867e}
.big-score{font-size:60px;color:#238b7b;font-weight:900;margin:7px 0 2px}.points{font-size:15px;font-weight:900;color:#9b7620;margin-bottom:20px}
.result-card{background:var(--paper);border:2px solid var(--line);border-radius:13px;padding:13px;margin-bottom:16px;text-align:left}
.result-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #efe6d4;font-size:13px;font-weight:800}.result-row:last-child{border:0}
.result-row strong{color:var(--green)}
.btn{width:100%;min-height:46px;background:var(--green);color:#fff;border:2px solid var(--green-dark);border-radius:8px;font-weight:900;font-size:15px;box-shadow:var(--shadow);cursor:pointer;padding:9px;margin:5px 0}
.btn.secondary{background:var(--paper);color:var(--green);box-shadow:0 3px 0 var(--line);border-color:var(--line)}
.tiny-note{text-align:center;color:#89958d;font-size:10px;font-weight:700;margin-top:11px}
@media (min-width:461px){.game{min-height:760px;border-radius:18px;box-shadow:0 12px 40px #b8aa9b}.photo{height:280px}}
</style>
</head>
<body>
<main class="game">
  <section id="menu" class="screen active">
    <h1>What is<br>this?</h1>
    <div class="subtitle">Picture Quest</div>
    <div class="stats-strip">
      <div class="stat"><strong id="gamesPlayed">0</strong><span>Games</span></div>
      <div class="stat"><strong id="bestScore">0/10</strong><span>Best score</span></div>
      <div class="stat"><strong id="totalCorrect">0</strong><span>Correct</span></div>
    </div>
    <div class="mode-box">
      <div class="mode-title">Choose your challenge</div>
      <div class="mode-switch">
        <button class="selected" data-mode="classic">🌿 CLASSIC</button>
        <button data-mode="timed">⚡ TIME ATTACK</button>
      </div>
    </div>
    <div class="menu-grid">
      <button class="category" data-cat="animal"><div class="icon">🐱</div><div class="category-name">ANIMAL</div><div class="category-meta" id="meta-animal">Best: — / 10</div></button>
      <button class="category" data-cat="place"><div class="icon">🏫</div><div class="category-name">PLACE</div><div class="category-meta" id="meta-place">Best: — / 10</div></button>
      <button class="category" data-cat="fruit"><div class="icon">🍉</div><div class="category-name">FRUIT</div><div class="category-meta" id="meta-fruit">Best: — / 10</div></button>
      <button class="category" data-cat="food"><div class="icon">🍕</div><div class="category-name">FOOD</div><div class="category-meta" id="meta-food">Best: — / 10</div></button>
    </div>
    <button id="daily" class="daily-btn">🏆 DAILY MIX <small id="dailyMeta">10 questions from every category</small></button>
    <div class="tiny-note">Your progress is saved on this device</div>
  </section>

  <section id="quiz" class="screen">
    <div class="quiz-head">
      <button id="quit" class="back-btn" aria-label="Back to menu">‹</button>
      <div class="quiz-title"><span id="catLabel"></span><small id="modeLabel"></small></div>
      <div id="scoreLabel" class="quiz-score">★ 0</div>
    </div>
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    <div id="timerTrack" class="timer-track" hidden><div id="timerFill" class="timer-fill"></div></div>
    <div class="photo"><img id="photo" alt=""><div id="fallback" class="fallback" hidden></div></div>
    <div id="answers" class="answers"></div>
    <div class="quiz-tools"><div id="feedback" class="feedback"></div><button id="hint" class="hint-btn">💡 HINT ×2</button></div>
  </section>

  <section id="result" class="screen result">
    <div id="resultBadge" class="result-badge">🎉</div>
    <h1 id="resultTitle">Great job!</h1>
    <div class="result-label">YOUR SCORE</div>
    <div id="finalScore" class="big-score">0 / 10</div>
    <div id="finalPoints" class="points">★ 0 คะแนน</div>
    <div class="result-card">
      <div class="result-row"><span>Longest combo</span><strong id="finalCombo">0</strong></div>
      <div class="result-row"><span>Hints used</span><strong id="finalHints">0</strong></div>
      <div class="result-row"><span>Best score</span><strong id="finalBest">0 / 10</strong></div>
    </div>
    <button id="again" class="btn">PLAY AGAIN</button>
    <button id="home" class="btn secondary">MENU</button>
  </section>
</main>

<script>
const data={
  animal:[
    {name:"Dog",file:"dog.jpg",emoji:"🐶"},{name:"Cat",file:"cat.jpg",emoji:"🐱"},{name:"Giraffe",file:"giraffe.jpg",emoji:"🦒"},{name:"Elephant",file:"elephant.jpg",emoji:"🐘"},{name:"Fish",file:"fish.jpg",emoji:"🐟"},{name:"Bird",file:"bird.jpg",emoji:"🐦"},{name:"Monkey",file:"monkey.jpg",emoji:"🐒"},{name:"Lion",file:"lion.jpg",emoji:"🦁"},{name:"Deer",file:"deer.jpg",emoji:"🦌"},{name:"Horse",file:"horse.jpg",emoji:"🐴"}],
  place:[
    {name:"Beach",file:"beach.jpg",emoji:"🏖️"},{name:"Garden",file:"garden.jpg",emoji:"🌷"},{name:"Mountain",file:"mountain.jpg",emoji:"⛰️"},{name:"House",file:"house.jpg",emoji:"🏠"},{name:"Library",file:"library.jpg",emoji:"📚"},{name:"Waterfall",file:"waterfall.jpg",emoji:"💦"},{name:"Market",file:"market.jpg",emoji:"🛒"},{name:"Classroom",file:"classroom.jpg",emoji:"🏫"},{name:"Hospital",file:"hospital.jpg",emoji:"🏥"},{name:"Playground",file:"playground.jpg",emoji:"🛝"}],
  fruit:[
    {name:"Watermelon",file:"watermelon.jpg",emoji:"🍉"},{name:"Durian",file:"durian.jpg",emoji:"🟢"},{name:"Apple",file:"apple.jpg",emoji:"🍎"},{name:"Mango",file:"mango.jpg",emoji:"🥭"},{name:"Orange",file:"orange.jpg",emoji:"🍊"},{name:"Grape",file:"grape.jpg",emoji:"🍇"},{name:"Banana",file:"banana.jpg",emoji:"🍌"},{name:"Mangosteen",file:"mangosteen.jpg",emoji:"🟣"},{name:"Longan",file:"longan.jpg",emoji:"🟤"},{name:"Pineapple",file:"pineapple.jpg",emoji:"🍍"}],
  food:[
    {name:"Fried Rice",file:"fried-rice.jpg",emoji:"🍚"},{name:"Pizza",file:"pizza.jpg",emoji:"🍕"},{name:"Hamburger",file:"hamburger.jpg",emoji:"🍔"},{name:"Noodle",file:"noodle.jpg",emoji:"🍜"},{name:"Dumpling",file:"dumpling.jpg",emoji:"🥟"},{name:"Pad Thai",file:"pad-thai.jpg",emoji:"🍝"},{name:"Congee",file:"congee.jpg",emoji:"🥣"},{name:"Fried Chicken",file:"fried-chicken.jpg",emoji:"🍗"},{name:"Steak",file:"steak.jpg",emoji:"🥩"},{name:"French Fries",file:"french-fries.jpg",emoji:"🍟"}]
};
const categoryLabels={animal:"ANIMAL",place:"PLACE",fruit:"FRUIT",food:"FOOD"};
const displayName=name=>name;
let audioContext=null;
function playSound(type){
  try{
    audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==="suspended")audioContext.resume();
    const notes={correct:[523.25,659.25],wrong:[220,165],timeout:[180,130],hint:[440]};
    const frequencies=notes[type]||notes.hint;
    frequencies.forEach((frequency,index)=>{
      const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
      oscillator.type=type==="wrong"||type==="timeout"?"sawtooth":"sine";
      oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.0001,audioContext.currentTime+index*.1);
      gain.gain.exponentialRampToValueAtTime(.12,audioContext.currentTime+index*.1+.02);
      gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+index*.1+.16);
      oscillator.connect(gain);gain.connect(audioContext.destination);
      oscillator.start(audioContext.currentTime+index*.1);oscillator.stop(audioContext.currentTime+index*.1+.18);
    });
  }catch(error){/* Sound is optional; the game still works when audio is blocked. */}
}
const $=id=>document.getElementById(id);
const shuffle=array=>{const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const todayKey=()=>{const date=new Date();return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`};
const defaultStats=()=>({games:0,correct:0,best:{},bestPoints:0,dailyPlayed:"",dailyScore:0});
let stats=JSON.parse(localStorage.getItem("pictureQuestStats")||"null")||defaultStats();
let currentCategory="",questions=[],index=0,correctCount=0,points=0,combo=0,maxCombo=0,hints=2,hintsUsed=0,locked=false,mode="classic",timerId=null,timeLeft=0,isDaily=false;
function saveStats(){localStorage.setItem("pictureQuestStats",JSON.stringify(stats))}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active")}
function refreshMenu(){
  $("gamesPlayed").textContent=stats.games;
  $("totalCorrect").textContent=stats.correct;
  $("bestScore").textContent=`${stats.bestPoints||0}/10`;
  Object.keys(data).forEach(cat=>{$(`meta-${cat}`).textContent=`Best: ${stats.best[cat]||"—"} / 10`});
  const played=stats.dailyPlayed===todayKey();
  $("dailyMeta").textContent=played?`Completed today: ${stats.dailyScore}/10`:"10 questions from every category";
}
function seededShuffle(array,seed){const a=[...array];let value=seed.split("").reduce((sum,char)=>sum+char.charCodeAt(0),0);for(let i=a.length-1;i>0;i--){value=(value*9301+49297)%233280;const j=Math.floor(value/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(cat){
  stopTimer();isDaily=false;currentCategory=cat;questions=shuffle(data[cat]).map(item=>({...item,cat}));beginRound();
}
function startDaily(){
  stopTimer();isDaily=true;currentCategory="daily";
  const all=Object.entries(data).flatMap(([cat,items])=>items.map(item=>({...item,cat})));
  questions=seededShuffle(all,todayKey()).slice(0,10);beginRound();
}
function beginRound(){index=0;correctCount=0;points=0;combo=0;maxCombo=0;hints=2;hintsUsed=0;show("quiz");render()}
function render(){
  locked=false;const correct=questions[index];
  $("catLabel").textContent=isDaily?`DAILY MIX · ${categoryLabels[correct.cat]}`:categoryLabels[currentCategory];
  $("modeLabel").textContent=mode==="timed"?"⚡ 12 seconds per question":"🌿 No time limit";
  $("scoreLabel").textContent=`★ ${points}`;
  $("progressFill").style.width=`${(index/questions.length)*100}%`;
  $("feedback").textContent="";$("hint").textContent=`💡 HINT ×${hints}`;$("hint").disabled=hints===0;
  const img=$("photo"),fallback=$("fallback");img.hidden=false;fallback.hidden=true;
  img.src=`images/${correct.cat}/${correct.file}`;img.alt=displayName(correct.name);
  img.onerror=()=>{img.hidden=true;fallback.hidden=false;fallback.textContent=correct.emoji};
  const wrong=shuffle(data[correct.cat].filter(item=>item.name!==correct.name)).slice(0,2);
  $("answers").innerHTML="";
  shuffle([correct,...wrong]).forEach(choice=>{
    const button=document.createElement("button");button.className="answer";button.textContent=displayName(choice.name);button.dataset.answer=choice.name;
    button.onclick=()=>answer(choice.name,correct.name,button);$("answers").appendChild(button);
  });
  if(mode==="timed"){ $("timerTrack").hidden=false;startTimer() } else $("timerTrack").hidden=true;
}
function startTimer(){
  stopTimer();timeLeft=12;updateTimer();
  timerId=setInterval(()=>{timeLeft-=.1;updateTimer();if(timeLeft<=0){stopTimer();answer("",questions[index].name,null,true)}},100);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function updateTimer(){const fill=$("timerFill");fill.style.width=`${Math.max(0,timeLeft/12*100)}%`;fill.classList.toggle("danger",timeLeft<=4)}
function answer(choice,correct,button,timedOut=false){
  if(locked)return;locked=true;stopTimer();
  const buttons=[...document.querySelectorAll(".answer")];buttons.forEach(item=>item.disabled=true);
  if(choice===correct){
    correctCount++;combo++;maxCombo=Math.max(maxCombo,combo);const earned=100+(combo-1)*25;points+=earned;
    playSound("correct");button.classList.add("correct");$("feedback").textContent=`✓ Correct! +${earned} points`;
  }else{
    combo=0;if(button)button.classList.add("wrong");buttons.find(item=>item.dataset.answer===correct)?.classList.add("correct");
    playSound(timedOut?"timeout":"wrong");$("feedback").textContent=timedOut?`⌛ Time's up! It was ${displayName(correct)}.`:`✕ The answer is ${displayName(correct)}.`;
  }
  $("scoreLabel").textContent=`★ ${points}`;
  setTimeout(()=>{index++;if(index<questions.length)render();else finishGame()},850);
}
function useHint(){
  if(locked||hints===0)return;hints--;hintsUsed++;
  const correct=questions[index].name;const buttons=[...document.querySelectorAll(".answer")].filter(button=>button.dataset.answer!==correct&&!button.disabled);
  shuffle(buttons).slice(0,1).forEach(button=>{button.disabled=true;button.style.opacity=".35";button.textContent="—"});
  playSound("hint");$("hint").textContent=`💡 HINT ×${hints}`;$("hint").disabled=hints===0;$("feedback").textContent="💡 One wrong answer removed";
}
function finishGame(){
  stopTimer();stats.games++;stats.correct+=correctCount;stats.bestPoints=Math.max(stats.bestPoints,correctCount);
  if(!isDaily)stats.best[currentCategory]=Math.max(stats.best[currentCategory]||0,correctCount);
  if(isDaily){stats.dailyPlayed=todayKey();stats.dailyScore=correctCount}
  saveStats();refreshMenu();
  $("resultBadge").textContent=correctCount===10?"🏆":correctCount>=7?"🎉":"💪";
  $("resultTitle").textContent=correctCount===10?"Perfect round!":correctCount>=7?"Great job!":"Keep practising!";
  $("finalScore").textContent=`${correctCount} / ${questions.length}`;$("finalPoints").textContent=`★ ${points} points`;
  $("finalCombo").textContent=`×${maxCombo}`;$("finalHints").textContent=hintsUsed;$("finalBest").textContent=`${isDaily?stats.dailyScore:(stats.best[currentCategory]||correctCount)} / 10`;
  show("result");
}
document.querySelectorAll(".category").forEach(button=>button.onclick=()=>startGame(button.dataset.cat));
document.querySelectorAll(".mode-switch button").forEach(button=>button.onclick=()=>{
  mode=button.dataset.mode;document.querySelectorAll(".mode-switch button").forEach(item=>item.classList.remove("selected"));button.classList.add("selected");
});
$("daily").onclick=startDaily;$("hint").onclick=useHint;$("quit").onclick=()=>{stopTimer();show("menu");refreshMenu()};
$("again").onclick=()=>isDaily?startDaily():startGame(currentCategory);$("home").onclick=()=>{stopTimer();show("menu");refreshMenu()};
refreshMenu();
</script>
</body>
</html>
